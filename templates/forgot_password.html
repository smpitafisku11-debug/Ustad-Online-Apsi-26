<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#173B63">
    <title>Lupa Password | Ustad Online</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand-logo.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
    {% include "partials/language_settings.html" %}
</head>
<body class="password-reset-page">
    <main class="password-reset-card" aria-labelledby="password-reset-title">
        <a class="password-reset-brand" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='brand-logo.svg') }}" alt="">
            <span>USTAD <b>ONLINE</b></span>
        </a>
        <div class="password-reset-mark" aria-hidden="true">✦</div>
        <p class="password-reset-kicker" data-language-key="forgot.kicker">PEMULIHAN AKUN</p>
        <h1 id="password-reset-title" data-language-key="forgot.lowercaseTitle">Lupa password?</h1>
        <p class="password-reset-intro" data-language-key="forgot.intro">Masukkan email yang Anda gunakan saat mendaftar. Jika cocok dengan akun, kami akan mengirim tautan untuk membuat password baru.</p>
        <form class="password-reset-form" method="post" action="{{ url_for('auth_api.forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="reset-email" data-language-key="forgot.email">Alamat email</label>
            <input id="reset-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="nama@email.com" required>
            <button type="submit"><span data-language-key="forgot.send">Kirim tautan reset</span> <span aria-hidden="true">↗</span></button>
        </form>
        {% if feedback %}
        <p class="password-reset-feedback" role="status" aria-live="polite">{{ feedback }}</p>
        {% endif %}
        <a class="password-reset-back" href="{{ url_for('home') }}">← Kembali ke Login</a>
    </main>
</body>
</html>
