<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0A192F">
    <title>Komunitas Grup | Ustad Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; --navy:#172f5f; --emerald:#07805b; --line:#dfe6ef; --muted:#718096; }
        * { box-sizing:border-box; }
        [hidden] { display:none !important; }
        body { margin:0; min-height:100vh; overflow:hidden; color:#24344e; background:#edf2f7; font-family:'DM Sans',sans-serif; }
        button,input,textarea { font:inherit; }
        button { cursor:pointer; }
        a { color:inherit; text-decoration:none; }
        .topbar { height:58px; display:flex; align-items:center; border-bottom:1px solid #dce4ed; background:#fff; }
        .topbar-inner { width:min(1180px,calc(100% - 24px)); margin:auto; display:flex; align-items:center; justify-content:space-between; }
        .brand { color:var(--navy); font-family:'Space Grotesk',sans-serif; font-weight:700; }
        .back-link { display:inline-flex; height:38px; align-items:center; border:1px solid var(--line); border-radius:9px; background:#fff; padding:0 12px; color:var(--navy); font-size:.78rem; font-weight:700; }
        .app-shell { width:min(1180px,calc(100% - 24px)); height:calc(100vh - 82px); margin:12px auto; display:grid; grid-template-columns:330px minmax(0,1fr); overflow:hidden; border:1px solid #d6e0eb; border-radius:18px; background:#fff; box-shadow:0 12px 40px rgba(23,47,95,.10); }
        .sidebar { min-width:0; border-right:1px solid #dde5ef; background:#fbfdff; }
        .sidebar-header { height:72px; display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:1px solid #e5ebf2; padding:10px 12px 10px 16px; }
        .sidebar-title { margin:0; color:var(--navy); font-family:'Space Grotesk',sans-serif; font-size:1.05rem; }
        .header-actions { display:flex; gap:6px; }
        .icon-button { width:38px; height:38px; display:grid; place-items:center; border:1px solid #dfe7ef; border-radius:50%; background:#fff; color:var(--navy); font-size:1rem; }
        .profile-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:9px 12px; border-bottom:1px solid #edf1f5; }
        .profile-row input { min-width:0; height:38px; border:1px solid #dce4ed; border-radius:9px; padding:0 10px; outline:none; color:#263650; }
        .profile-row input:focus { border-color:#48b68b; box-shadow:0 0 0 3px #e6f8ef; }
        .small-button { height:38px; border:0; border-radius:9px; background:var(--emerald); padding:0 11px; color:#fff; font-size:.75rem; font-weight:700; }
        .search-row { padding:9px 12px; }
        .search-row input { width:100%; height:38px; border:1px solid #e0e6ee; border-radius:10px; outline:none; background:#f4f7fa; padding:0 12px; }
        .group-list { height:calc(100% - 168px); overflow-y:auto; }
        .group-row { width:100%; min-height:72px; display:grid; grid-template-columns:48px minmax(0,1fr) auto; align-items:center; gap:10px; border:0; border-top:1px solid #edf1f5; background:#fff; padding:9px 12px; text-align:left; }
        .group-row:hover { background:#f4fbf7; }
        .group-row.active { background:#eaf7f1; }
        .group-avatar { width:48px; height:48px; display:grid; place-items:center; border-radius:50%; background:linear-gradient(145deg,#15366d,#07805b); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; }
        .group-copy { min-width:0; }
        .group-name { overflow:hidden; color:#1d3154; font-size:.88rem; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
        .group-preview { overflow:hidden; margin-top:4px; color:#7b8798; font-size:.72rem; text-overflow:ellipsis; white-space:nowrap; }
        .group-meta { align-self:start; margin-top:9px; color:#8b96a5; font-size:.62rem; }
        .chat { min-width:0; display:grid; grid-template-rows:72px minmax(0,1fr) 68px; background:#eef3ef; }
        .chat-header { display:flex; align-items:center; gap:10px; border-bottom:1px solid #dfe6ec; background:#fff; padding:10px 15px; }
        .chat-header-copy { min-width:0; }
        .chat-title { margin:0; overflow:hidden; color:#1b2f52; font-size:.92rem; text-overflow:ellipsis; white-space:nowrap; }
        .chat-subtitle { margin-top:3px; color:#7a8798; font-size:.68rem; }
        .messages { overflow-y:auto; background-image:linear-gradient(rgba(243,248,245,.92),rgba(243,248,245,.92)),radial-gradient(circle at 15% 20%,#cde4d5 1px,transparent 2px); background-size:auto,18px 18px; padding:18px 28px; }
        .empty-chat { max-width:330px; margin:30px auto; border-radius:14px; background:rgba(255,255,255,.88); padding:20px; color:#69788d; font-size:.78rem; line-height:1.6; text-align:center; }
        .message-row { display:flex; margin:4px 0; }
        .message-row.mine { justify-content:flex-end; }
        .bubble { max-width:min(68%,560px); border-radius:11px 11px 11px 3px; background:#fff; padding:8px 10px 5px; box-shadow:0 1px 2px rgba(41,61,73,.10); }
        .mine .bubble { border-radius:11px 11px 3px 11px; background:#dcf8c6; }
        .sender { display:block; margin-bottom:3px; color:#07805b; font-size:.66rem; font-weight:800; }
        .message-text { color:#263650; font-size:.84rem; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
        .message-time { display:block; margin-top:3px; color:#8994a2; font-size:.58rem; text-align:right; }
        .composer { display:grid; grid-template-columns:minmax(0,1fr) 46px; gap:8px; align-items:center; border-top:1px solid #dde5ec; background:#f8faf9; padding:10px 13px; }
        .composer input { width:100%; height:46px; border:1px solid #dde5ec; border-radius:23px; outline:none; background:#fff; padding:0 16px; }
        .composer input:focus { border-color:#48b68b; box-shadow:0 0 0 3px #e6f8ef; }
        .send-button { width:46px; height:46px; border:0; border-radius:50%; background:var(--emerald); color:#fff; font-size:1.1rem; }
        button:disabled { opacity:.48; cursor:not-allowed; }
        .modal-backdrop { position:fixed; z-index:50; inset:0; display:grid; place-items:center; background:rgba(12,25,47,.38); padding:16px; }
        .modal { width:min(430px,100%); border-radius:16px; background:#fff; padding:18px; box-shadow:0 20px 50px rgba(12,25,47,.22); }
        .modal h2 { margin:0 0 14px; color:var(--navy); font-size:1.1rem; }
        .modal label { display:block; margin-top:9px; color:#40516a; font-size:.75rem; font-weight:700; }
        .modal input,.modal textarea { width:100%; margin-top:5px; border:1px solid #dce4ed; border-radius:9px; outline:none; padding:10px; }
        .modal textarea { min-height:78px; resize:vertical; }
        .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
        .modal-actions button { height:40px; border:1px solid #dce4ed; border-radius:9px; background:#fff; padding:0 12px; color:var(--navy); font-weight:700; }
        .modal-actions .primary { border-color:var(--emerald); background:var(--emerald); color:#fff; }
        .status { min-height:17px; margin:8px 0 0; color:#69788d; font-size:.72rem; }
        .status.error { color:#a33838; }
        @media(max-width:760px){
            body { overflow:hidden; }
            .topbar { height:52px; }
            .app-shell { width:100%; height:calc(100vh - 52px); margin:0; grid-template-columns:1fr; border:0; border-radius:0; }
            .app-shell.chat-open .sidebar { display:none; }
            .app-shell:not(.chat-open) .chat { display:none; }
            .group-list { height:calc(100% - 168px); }
            .messages { padding:12px; }
            .bubble { max-width:82%; }
            .mobile-back { display:grid !important; }
        }
        .mobile-back { display:none; width:38px; height:38px; place-items:center; border:0; border-radius:50%; background:#f1f5f8; color:var(--navy); }
    </style>
    {% include "partials/page_transitions.html" %}
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{{ url_for('home') }}">Ustad Online · Komunitas</a>
            <a class="back-link" href="{{ url_for('home') }}">← Beranda</a>
        </div>
    </header>
    <main class="app-shell" id="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">Grup Komunitas</h1>
                <div class="header-actions">
                    <button class="icon-button" id="open-create" type="button" title="Buat grup" aria-label="Buat grup">＋</button>
                </div>
            </div>
            <div class="profile-row">
                <input id="profile-name" maxlength="30" value="Pemain Ustad" autocomplete="name" aria-label="Nama Anda">
                <button class="small-button" id="save-profile" type="button">Simpan</button>
            </div>
            <div class="search-row"><input id="group-search" type="search" placeholder="Cari grup..." aria-label="Cari grup"></div>
            <div class="group-list" id="group-list"></div>
        </aside>
        <section class="chat" aria-label="Percakapan grup">
            <header class="chat-header">
                <button class="mobile-back" id="mobile-back" type="button" aria-label="Kembali ke daftar grup">←</button>
                <div class="group-avatar" id="chat-avatar">G</div>
                <div class="chat-header-copy">
                    <h2 class="chat-title" id="chat-title">Pilih grup</h2>
                    <div class="chat-subtitle" id="chat-subtitle">Gabung untuk mulai mengirim pesan</div>
                </div>
            </header>
            <div class="messages" id="messages" aria-live="polite">
                <div class="empty-chat">Pilih grup di sebelah kiri untuk melihat percakapan.</div>
            </div>
            <form class="composer" id="composer">
                <input id="message-input" maxlength="1000" placeholder="Ketik pesan..." autocomplete="off" disabled>
                <button class="send-button" id="send-message" type="submit" disabled aria-label="Kirim pesan">➤</button>
            </form>
        </section>
    </main>

    <div class="modal-backdrop" id="create-modal" hidden>
        <form class="modal" id="create-form">
            <h2>Buat Grup Baru</h2>
            <label>Nama grup
                <input id="create-name" maxlength="30" required placeholder="Contoh: Halaqah Subuh">
            </label>
            <label>Deskripsi singkat
                <textarea id="create-description" maxlength="160" placeholder="Tujuan dan topik grup"></textarea>
            </label>
            <p class="status" id="create-status" role="status"></p>
            <div class="modal-actions">
                <button id="close-create" type="button">Batal</button>
                <button class="primary" type="submit">Buat Grup</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        (() => {
            const communitySocket = typeof window.io === 'function' ? window.io() : null;
            const apiBase = '/api/community';
            const profileKey = 'ustadOnline.community.profile.v1';
            const memberKey = 'ustadOnline.community.member.v1';
            const appShell = document.getElementById('app-shell');
            const groupList = document.getElementById('group-list');
            const messagesPanel = document.getElementById('messages');
            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-message');
            const profileName = document.getElementById('profile-name');
            const createModal = document.getElementById('create-modal');
            let groups = [];
            let activeGroup = null;
            let memberIds = {};
            let searchTimer = null;

            try {
                const savedProfile = localStorage.getItem(profileKey);
                if (savedProfile) profileName.value = savedProfile;
                memberIds = JSON.parse(localStorage.getItem(memberKey) || '{}');
                if (!memberIds || typeof memberIds !== 'object') memberIds = {};
            } catch (error) {
                memberIds = {};
            }

            async function api(path, options) {
                const response = await fetch(`${apiBase}${path}`, options || {});
                let payload;
                try { payload = await response.json(); } catch (error) { throw new Error('Respons server tidak valid.'); }
                if (!response.ok) throw new Error(payload.error || 'Permintaan gagal.');
                return payload;
            }

            function jsonOptions(body) {
                return { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) };
            }

            function cleanName() {
                const name = profileName.value.trim().replace(/\s+/g,' ');
                if (name.length < 2 || name.length > 30) throw new Error('Nama harus 2-30 karakter.');
                return name;
            }

            function saveProfile() {
                try {
                    const name = cleanName();
                    localStorage.setItem(profileKey, name);
                    return name;
                } catch (error) {
                    alert(error.message);
                    return null;
                }
            }

            function timeLabel(value) {
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return '';
                return date.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            }

            function renderGroups() {
                groupList.replaceChildren();
                if (!groups.length) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-chat';
                    empty.textContent = 'Grup tidak ditemukan.';
                    groupList.append(empty);
                    return;
                }
                groups.forEach((group) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = `group-row${activeGroup && activeGroup.id === group.id ? ' active' : ''}`;
                    const avatar = document.createElement('span');
                    avatar.className = 'group-avatar';
                    avatar.textContent = group.name.trim().charAt(0).toUpperCase();
                    const copy = document.createElement('div');
                    copy.className = 'group-copy';
                    const name = document.createElement('div');
                    name.className = 'group-name';
                    name.textContent = group.name;
                    const preview = document.createElement('div');
                    preview.className = 'group-preview';
                    preview.textContent = group.last_message ? `${group.last_message.sender}: ${group.last_message.text}` : group.description;
                    copy.append(name, preview);
                    const meta = document.createElement('span');
                    meta.className = 'group-meta';
                    meta.textContent = group.last_message ? timeLabel(group.last_message.created_at) : `${group.member_count} anggota`;
                    button.append(avatar, copy, meta);
                    button.addEventListener('click', () => openGroup(group.id));
                    groupList.append(button);
                });
            }

            function renderMessages(payload) {
                const myName = profileName.value.trim();
                messagesPanel.replaceChildren();
                if (!payload.messages.length) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-chat';
                    empty.textContent = 'Belum ada pesan. Jadilah yang pertama menyapa.';
                    messagesPanel.append(empty);
                    return;
                }
                payload.messages.forEach((message) => {
                    const row = document.createElement('div');
                    row.className = `message-row${message.sender === myName ? ' mine' : ''}`;
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    const sender = document.createElement('span');
                    sender.className = 'sender';
                    sender.textContent = message.sender;
                    const text = document.createElement('div');
                    text.className = 'message-text';
                    text.textContent = message.text;
                    const time = document.createElement('time');
                    time.className = 'message-time';
                    time.textContent = timeLabel(message.created_at);
                    bubble.append(sender, text, time);
                    row.append(bubble);
                    messagesPanel.append(row);
                });
                messagesPanel.scrollTop = messagesPanel.scrollHeight;
            }

            async function openGroup(groupId) {
                try {
                    const name = saveProfile();
                    if (!name) return;
                    let memberId = memberIds[groupId];
                    if (!memberId) {
                        const joined = await api(`/groups/${encodeURIComponent(groupId)}/join`, jsonOptions({name}));
                        memberId = joined.member_id;
                        memberIds[groupId] = memberId;
                        localStorage.setItem(memberKey, JSON.stringify(memberIds));
                    }
                    if (activeGroup && communitySocket) {
                        communitySocket.emit('leave_community', {group_id:activeGroup.id});
                    }
                    const payload = await api(`/groups/${encodeURIComponent(groupId)}/messages`);
                    activeGroup = payload.group;
                    appShell.classList.add('chat-open');
                    document.getElementById('chat-avatar').textContent = activeGroup.name.trim().charAt(0).toUpperCase();
                    document.getElementById('chat-title').textContent = activeGroup.name;
                    document.getElementById('chat-subtitle').textContent = `${activeGroup.member_count} anggota · ${payload.members.length} bergabung`;
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    renderMessages(payload);
                    renderGroups();
                    if (communitySocket) communitySocket.emit('join_community', {group_id:groupId});
                } catch (error) {
                    alert(error.message);
                }
            }

            async function loadGroups(query) {
                try {
                    const path = `/groups${query ? `?q=${encodeURIComponent(query)}` : ''}`;
                    groups = await api(path);
                    renderGroups();
                } catch (error) {
                    groupList.textContent = error.message;
                }
            }

            document.getElementById('save-profile').addEventListener('click', () => saveProfile());
            document.getElementById('group-search').addEventListener('input', (event) => {
                window.clearTimeout(searchTimer);
                searchTimer = window.setTimeout(() => loadGroups(event.target.value.trim()), 180);
            });
            document.getElementById('mobile-back').addEventListener('click', () => appShell.classList.remove('chat-open'));
            document.getElementById('open-create').addEventListener('click', () => {
                createModal.hidden = false;
                document.getElementById('create-name').focus();
            });
            document.getElementById('close-create').addEventListener('click', () => { createModal.hidden = true; });
            createModal.addEventListener('click', (event) => { if (event.target === createModal) createModal.hidden = true; });

            document.getElementById('create-form').addEventListener('submit', async (event) => {
                event.preventDefault();
                const status = document.getElementById('create-status');
                status.className = 'status';
                status.textContent = '';
                try {
                    const name = saveProfile();
                    if (!name) return;
                    const created = await api('/groups', jsonOptions({
                        name:document.getElementById('create-name').value,
                        description:document.getElementById('create-description').value,
                        creator:name
                    }));
                    memberIds[created.group.id] = created.member_id;
                    localStorage.setItem(memberKey, JSON.stringify(memberIds));
                    createModal.hidden = true;
                    document.getElementById('create-form').reset();
                    await loadGroups('');
                    await openGroup(created.group.id);
                } catch (error) {
                    status.className = 'status error';
                    status.textContent = error.message;
                }
            });

            document.getElementById('composer').addEventListener('submit', async (event) => {
                event.preventDefault();
                if (!activeGroup) return;
                const text = messageInput.value.trim();
                if (!text) return;
                try {
                    const memberId = memberIds[activeGroup.id];
                    const payload = await api(`/groups/${encodeURIComponent(activeGroup.id)}/messages`, jsonOptions({member_id:memberId, text}));
                    messageInput.value = '';
                    await openGroup(activeGroup.id);
                } catch (error) {
                    alert(error.message);
                }
            });

            if (communitySocket) {
                communitySocket.on('community_message', (event) => {
                    if (activeGroup && event && event.group_id === activeGroup.id) openGroup(activeGroup.id);
                });
            }

            loadGroups('');
        })();
    </script>
</body>
</html>
