<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Kata Sandi | Ustad Online</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7f4;color:#17362b;font-family:Segoe UI,sans-serif}
        main{width:min(420px,calc(100% - 32px));border:1px solid #dfe8e1;border-radius:18px;background:#fff;padding:28px;box-shadow:0 18px 50px rgba(25,65,47,.12)}
        h1{margin:0 0 8px;font-size:1.35rem}p{color:#617067}label{display:block;margin:18px 0 6px;font-weight:700}
        input{width:100%;min-height:46px;border:1px solid #ccdacf;border-radius:10px;padding:10px 12px}
        button{width:100%;min-height:46px;margin-top:14px;border:0;border-radius:10px;background:#17684d;color:#fff;font-weight:700}
        [role=status]{min-height:22px}
    </style>
</head>
<body>
<main>
    <h1>Atur kata sandi baru</h1>
    {% if invalid %}
        <p role="alert">Tautan reset tidak valid atau sudah kedaluwarsa.</p>
        <a href="/">Kembali ke Ustad Online</a>
    {% else %}
        <form id="reset-password-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="token" value="{{ token }}">
            <label for="new-password">Kata sandi baru</label>
            <input id="new-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
            <button type="submit">Simpan kata sandi</button>
            <p id="reset-status" role="status"></p>
        </form>
    {% endif %}
</main>
<script>
document.getElementById('reset-password-form')?.addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const status = document.getElementById('reset-status');
    const data = Object.fromEntries(new FormData(form).entries());
    status.textContent = 'Memproses...';
    try {
        const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRF-Token': data.csrf_token},
            credentials: 'same-origin',
            body: JSON.stringify({token: data.token, password: data.password})
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Reset gagal.');
        status.textContent = result.message;
        form.reset();
    } catch (error) {
        status.textContent = error.message;
    }
});
</script>
</body>
</html>
